<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">MC Server Share desktop app thumbnail</title>
  <desc id="desc">Stylized desktop app window connecting a local Minecraft server to remote players.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.5" stop-color="#163225"/>
      <stop offset="1" stop-color="#261d12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="135" y="120" width="930" height="560" rx="28" fill="#0f172a" stroke="#334155"/>
    <rect x="135" y="120" width="930" height="70" rx="28" fill="#172033"/>
    <circle cx="185" cy="155" r="11" fill="#ef4444"/>
    <circle cx="225" cy="155" r="11" fill="#f59e0b"/>
    <circle cx="265" cy="155" r="11" fill="#22c55e"/>
  </g>
  <g fill="#e5e7eb" font-family="Inter, Arial, sans-serif">
    <text x="190" y="270" font-size="40" font-weight="700">MC Server Share</text>
    <text x="190" y="318" font-size="24" fill="#b8c3d6">Desktop host for sharing Java servers</text>
  </g>
  <g stroke="#a7f3d0" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M360 480 C470 375 585 375 700 480"/>
    <path d="M430 520 C510 455 550 455 630 520"/>
    <path d="M500 560 C535 535 560 535 595 560"/>
  </g>
  <g>
    <rect x="760" y="300" width="190" height="190" rx="18" fill="#2f6f3e" stroke="#5ee083" stroke-width="8"/>
    <rect x="795" y="335" width="45" height="45" fill="#8bd450"/>
    <rect x="870" y="335" width="45" height="45" fill="#6fb33f"/>
    <rect x="795" y="410" width="45" height="45" fill="#5d9335"/>
    <rect x="870" y="410" width="45" height="45" fill="#8bd450"/>
  </g>
  <g fill="#f5b84b">
    <rect x="190" y="430" width="120" height="42" rx="12"/>
    <rect x="190" y="500" width="210" height="18" rx="9" opacity="0.75"/>
    <rect x="190" y="540" width="270" height="18" rx="9" opacity="0.5"/>
  </g>
