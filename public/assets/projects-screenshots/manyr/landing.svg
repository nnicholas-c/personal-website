<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Manyr agent firewall thumbnail</title>
  <desc id="desc">Stylized product interface showing an agent tool call moving through policy evaluation, decision, and audit logging.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f3ee"/>
      <stop offset="0.6" stop-color="#ece7df"/>
      <stop offset="1" stop-color="#d8e5d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#1c1c1c" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="92" y="86" width="1016" height="628" rx="30" fill="#fffaf2" stroke="#d6cfc3" stroke-width="2"/>
    <rect x="142" y="170" width="360" height="398" rx="24" fill="#1c1c1c"/>
    <rect x="550" y="170" width="228" height="398" rx="24" fill="#f3eadb" stroke="#d6cfc3"/>
    <rect x="826" y="170" width="232" height="398" rx="24" fill="#f3eadb" stroke="#d6cfc3"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="142" y="135" fill="#1c1c1c" font-size="44" font-weight="700">Manyr</text>
    <text x="300" y="135" fill="#4a4a4a" font-size="24">Agent Firewall</text>
    <text x="178" y="248" fill="#f8fafc" font-size="24" font-weight="700">Incoming Tool Call</text>
    <text x="178" y="306" fill="#fde68a" font-size="22">execute_bash</text>
    <text x="178" y="354" fill="#e5e7eb" font-size="21">env: production</text>
    <text x="178" y="402" fill="#fca5a5" font-size="21">risk: high</text>
    <text x="586" y="248" fill="#1c1c1c" font-size="24" font-weight="700">Policy</text>
    <text x="586" y="316" fill="#4a4a4a" font-size="21">intercept</text>
    <text x="586" y="374" fill="#4a4a4a" font-size="21">evaluate</text>
    <text x="586" y="432" fill="#4a4a4a" font-size="21">decide</text>
    <text x="862" y="248" fill="#1c1c1c" font-size="24" font-weight="700">Audit</text>
    <text x="862" y="316" fill="#4a4a4a" font-size="21">decision: block</text>
    <text x="862" y="374" fill="#4a4a4a" font-size="21">reason: destructive</text>
    <text x="862" y="432" fill="#4a4a4a" font-size="21">log: signed</text>
  </g>
  <g>
    <path d="M500 370 H550" stroke="#1c1c1c" stroke-width="5" stroke-linecap="round"/>
    <path d="M778 370 H826" stroke="#1c1c1c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="664" cy="316" r="15" fill="#f6d365"/>
    <circle cx="664" cy="374" r="15" fill="#c7d2fe"/>
    <circle cx="664" cy="432" r="15" fill="#fca5a5"/>
    <rect x="866" y="492" width="146" height="46" rx="23" fill="#1c1c1c"/>
    <text x="895" y="522" fill="#fffaf2" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Blocked</text>
  </g>
</svg>
