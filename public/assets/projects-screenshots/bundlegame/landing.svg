<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">BundleGame research dashboard thumbnail</title>
  <desc id="desc">Stylized reinforcement learning dashboard with policy nodes, reward curves, and behavioral clusters.</desc>
  <defs>
